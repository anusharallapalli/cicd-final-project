apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup
      image: alpine:3.16
      command: ["/bin/sh"]
      args: ["-c", "rm -rf /workspace/source/*"]

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install nose2
        python3 -m nose2
